<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPC Studio</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #101522;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    height: 60px;
    background: #171f30;
    border-bottom: 1px solid #30394b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    color: #818cf8;
}

button {
    background: #6366f1;
    color: white;
    border: none;
    padding: 11px 16px;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

main {
    max-width: 900px;
    margin: 60px auto;
    padding: 20px;
}

h1 {
    font-size: 30px;
    margin-bottom: 12px;
}

.subtitle {
    color: #9ca3af;
    margin-bottom: 30px;
}

.actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 35px;
}

.project-list {
    background: #171f30;
    padding: 20px;
    border-radius: 10px;
}

.project-list h2 {
    font-size: 18px;
    margin-bottom: 15px;
}

.project {
    padding: 14px;
    border-bottom: 1px solid #30394b;
    cursor: pointer;
}

.project:hover {
    background: #222d42;
}

.workspace {
    display: none;
    height: calc(100vh - 60px);
}

.toolbar {
    background: #171f30;
    padding: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid #30394b;
}

.layout {
    display: flex;
    height: calc(100% - 55px);
}

.explorer {
    width: 230px;
    min-width: 150px;
    background: #171f30;
    border-right: 1px solid #30394b;
    padding: 15px;
    overflow-y: auto;
}

.explorer h3 {
    margin-bottom: 15px;
    font-size: 14px;
}

.tree-item {
    padding: 9px 5px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px;
}

.tree-item:hover {
    background: #28334a;
}

.editor-area {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.editor-title {
    background: #171f30;
    padding: 12px;
    border-bottom: 1px solid #30394b;
}

textarea {
    flex: 1;
    width: 100%;
    resize: none;
    background: #101522;
    color: #e5e7eb;
    border: none;
    outline: none;
    padding: 20px;
    font-family: monospace;
    font-size: 15px;
    line-height: 1.7;
}

.empty {
    color: #9ca3af;
    text-align: center;
    margin-top: 80px;
}

@media(max-width: 600px) {
    main {
        margin: 30px auto;
    }

    .explorer {
        width: 125px;
        padding: 8px;
    }

    .toolbar button {
        padding: 9px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">SPC Studio</div>
    <button onclick="goHome()">Dashboard</button>
</header>

<main id="dashboard">

    <h1>Welcome to SPC Studio</h1>

    <p class="subtitle">
        Your development environment for the SPC programming language.
    </p>

    <div class="actions">
        <button onclick="createWorkspace()">+ Create Workspace</button>
        <button onclick="openWorkspace()">Open Workspace</button>
    </div>

    <div class="project-list">
        <h2>Recent Workspaces</h2>
        <div id="recent">
            <p class="subtitle">No recent workspaces.</p>
        </div>
    </div>

</main>

<section class="workspace" id="workspace">

    <div class="toolbar">
        <button onclick="createFolder()">+ Folder</button>
        <button onclick="createFile()">+ File</button>
        <button onclick="renameItem()">Rename</button>
        <button onclick="deleteItem()">Delete</button>
        <button onclick="saveFile()">Save</button>
    </div>

    <div class="layout">

        <aside class="explorer">
            <h3>EXPLORER</h3>
            <div id="fileTree"></div>
        </aside>

        <section class="editor-area">

            <div class="editor-title" id="editorTitle">
                No file open
            </div>

            <textarea
                id="editor"
                placeholder="Select a file to start coding..."
                spellcheck="false"
                disabled
            ></textarea>

        </section>

    </div>

</section>

<script>
let projects = JSON.parse(
    localStorage.getItem("spcProjects") || "[]"
);

let currentProject = null;
let selectedItem = null;
let currentFile = null;

function persist() {
    localStorage.setItem(
        "spcProjects",
        JSON.stringify(projects)
    );
}

function createWorkspace() {
    const name = prompt("Enter workspace name:");

    if (!name || !name.trim()) return;

    const project = {
        name: name.trim(),
        files: []
    };

    projects.push(project);
    persist();
    loadWorkspace(project);
}

function openWorkspace() {
    if (projects.length === 0) {
        alert("No workspaces available. Create one first.");
        return;
    }

    const names = projects.map((p, i) => i + ": " + p.name);

    const choice = prompt(
        "Enter workspace number:\n" + names.join("\n")
    );

    if (choice === null) return;

    const index = Number(choice);

    if (!Number.isInteger(index) || !projects[index]) {
        alert("Invalid workspace.");
        return;
    }

    loadWorkspace(projects[index]);
}

function loadWorkspace(project) {
    currentProject = project;
    selectedItem = null;
    currentFile = null;

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("workspace").style.display = "block";

    document.getElementById("editor").value = "";
    document.getElementById("editor").disabled = true;

    renderTree();
}

function goHome() {
    saveFile();

    document.getElementById("workspace").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    renderRecent();
}

function createFolder() {
    const name = prompt("Enter folder name:");

    if (!name || !name.trim()) return;

    const parent = selectedItem?.type === "folder"
        ? selectedItem.item
        : null;

    const folder = {
        name: name.trim(),
        type: "folder",
        children: []
    };

    if (parent) {
        parent.children.push(folder);
    } else {
        currentProject.files.push(folder);
    }

    persist();
    renderTree();
}

function createFile() {
    const name = prompt("Enter file name (example: home.spc):");

    if (!name || !name.trim()) return;

    const parent = selectedItem?.type === "folder"
        ? selectedItem.item
        : null;

    const file = {
        name: name.trim(),
        type: "file",
        content: ""
    };

    if (parent) {
        parent.children.push(file);
    } else {
        currentProject.files.push(file);
    }

    persist();
    renderTree();
    openFile(file);
}

function renderTree() {
    const tree = document.getElementById("fileTree");
    tree.innerHTML = "";

    function draw(items, depth = 0) {
        items.forEach(item => {
            const row = document.createElement("div");
            row.className = "tree-item";
            row.style.paddingLeft = (depth * 14 + 5) + "px";

            row.textContent =
                (item.type === "folder" ? "📁 " : "📄 ") + item.name;

            row.onclick = () => {
                selectedItem = {item, type: item.type};

                if (item.type === "file") {
                    openFile(item);
                }
            };

            tree.appendChild(row);

            if (item.type === "folder") {
                draw(item.children, depth + 1);
            }
        });
    }

    draw(currentProject.files);
}

function openFile(file) {
    saveFile();

    currentFile = file;

    document.getElementById("editorTitle").textContent = file.name;

    const editor = document.getElementById("editor");
    editor.disabled = false;
    editor.value = file.content;
}

function saveFile() {
    if (!currentFile) return;

    currentFile.content = document.getElementById("editor").value;

    persist();
}

function renameItem() {
    if (!selectedItem) {
        alert("Select a file or folder first.");
        return;
    }

    const name = prompt("Enter new name:", selectedItem.item.name);

    if (!name || !name.trim()) return;

    selectedItem.item.name = name.trim();

    if (currentFile === selectedItem.item) {
        document.getElementById("editorTitle").textContent = name.trim();
    }

    persist();
    renderTree();
}

function deleteItem() {
    if (!selectedItem) {
        alert("Select a file or folder first.");
        return;
    }

    if (!confirm("Delete " + selectedItem.item.name + "?")) return;

    function remove(items, target) {
        const index = items.indexOf(target);

        if (index !== -1) {
            items.splice(index, 1);
            return true;
        }

        for (const item of items) {
            if (item.type === "folder" && remove(item.children, target)) {
                return true;
            }
        }

        return false;
    }

    remove(currentProject.files, selectedItem.item);

    if (currentFile === selectedItem.item) {
        currentFile = null;
        document.getElementById("editor").value = "";
        document.getElementById("editor").disabled = true;
        document.getElementById("editorTitle").textContent = "No file open";
    }

    selectedItem = null;

    persist();
    renderTree();
}

function renderRecent() {
    const recent = document.getElementById("recent");
    recent.innerHTML = "";

    if (projects.length === 0) {
        recent.textContent = "No recent workspaces.";
        return;
    }

    projects.forEach((project, index) => {
        const row = document.createElement("div");
        row.className = "project";
        row.textContent = "📁 " + project.name;

        row.onclick = () => loadWorkspace(projects[index]);

        recent.appendChild(row);
    });
}

renderRecent();
</script>

</body>
</html>
